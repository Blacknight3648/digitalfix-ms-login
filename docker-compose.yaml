version: '3.8'

# Red compartida para la arquitectura de microservicios DigitalFix
networks:
  digitalfix-net:
    name: digitalfix-net

services:
  ms-login:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-login-service
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8081}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=INFO
      # Evita que JVM intente conectar por IPv6 a Microsoft Entra ID en redes Docker sin salida IPv6
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
    volumes:
      # Montaje del Wallet mTLS de Oracle Cloud
      - ./wallet:/app/wallet:ro
    networks:
      - digitalfix-net