version: '3.8'

# Red con nombre fijo (no el nombre autogenerado "<carpeta>_default") para que
# otros microservicios (ej. digitalfix-ms-workorders) puedan unirse a esta
# misma red como "external" y llegar a este mismo Oracle centralizado por el
# hostname "oracle-db", sin duplicar el contenedor de base de datos.
networks:
  digitalfix-net:
    name: digitalfix-net

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=system
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - digitalfix-net

  ms-login:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-login-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=system
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
      # El contenedor no tiene ruta IPv6 real (Docker bridge network), pero
      # login.microsoftonline.com resuelve con registros AAAA. Sin este flag,
      # el JVM intenta conectar por IPv6 primero y falla con
      # "Network unreachable" en vez de reintentar por IPv4.
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - digitalfix-net

volumes:
  oracle_data: