name: Deploy to EC2

# Se dispara con cada push a la rama "deploy", o manualmente desde la pestaña Actions.
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

# Evita que dos despliegues corran en paralelo y se pisen entre sí.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: ./mvnw -B -ntp package -DskipTests

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + docker compose up -d --build)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"

            echo "==> Actualizando código a lo último de origin/deploy"
            git fetch origin deploy
            git reset --hard origin/deploy

            echo "==> Reconstruyendo y levantando contenedores"
            docker compose up -d --build

            echo "==> Limpiando imágenes viejas sin usar"
            docker image prune -f

            echo "==> Estado de los contenedores"
            docker compose ps
