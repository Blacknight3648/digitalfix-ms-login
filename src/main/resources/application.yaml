server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: digitalfix-ms-login

  config:
    import: optional:file:.env[.properties]

  # 1. Conexion a BD oracle con Wallet (OCI)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  # 2. Configuración de JPA / Hibernate para Oracle
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        # Relaciones LAZY en lotes de hasta 100 (IN) en vez de una consulta por fila: evita el N+1
        # en los listados, que contra Oracle Autonomous cuesta ~40 ms de red por consulta.
        default_batch_fetch_size: 100

  # 3. Configuración de flyway (compatible con Oracle)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_login
    locations: classpath:db/migration

  # 4. Microsoft Entra ID (Resource server)
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:3fb8463e-0e33-4b7d-adc1-2a47c707831e}
        credential:
          client-id: ${AZURE_CLIENT_ID:9494b59c-9c6e-4a0f-91ae-ae90212882e7}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:3fb8463e-0e33-4b7d-adc1-2a47c707831e}/v2.0
          audiences: api://${AZURE_CLIENT_ID:9494b59c-9c6e-4a0f-91ae-ae90212882e7}

# 5. CORS: origenes desde los que el frontend Angular puede llamar a esta API.
#   Variable CORS_ALLOWED_ORIGINS (lista separada por comas)

# 6. ms-user: fuente del rol de negocio (USUARIOS/ROLES) para la autorizacion por rol.
#   Variable MS_USER_URL (por defecto el puerto local de ms-user).
digitalfix:
  ms-user:
    url: ${MS_USER_URL:http://localhost:8082}
