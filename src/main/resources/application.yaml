spring:
  application:
    name: digitalfix-ms-login

  #1. Conexion a BD oracle
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      # Solucion de conflicto: configuracion para control de flyway
      ddl-auto: update

  #2. configuración de flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  #3. Microsoftentra ID(Resource server)
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: api://${AZURE_CLIENT_ID}

#4. CORS: origenes desde los que el frontend Angular puede llamar a esta API.
#   Variable CORS_ALLOWED_ORIGINS (lista separada por comas), leida directamente
#   por CorsConfigurationSource en SecurityConfig. Por defecto: http://localhost:4200